<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MelinaSMP Launcher</title>
<meta name="description" content="Pobierz launcher MelinaSMP i graj jednym kliknięciem.">
<link rel="icon" href="favicon.png">
<style>
  :root { --accent: #ffae1a; --on-accent: #221400; --bg: #110f15; --card: rgba(26, 23, 31, .72); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, sans-serif; color: #efeae4; background: var(--bg); overflow: hidden; }
  .bg { position: fixed; inset: -20px; background: radial-gradient(circle at 30% 20%, #2a2140, var(--bg) 70%) center / cover no-repeat; filter: blur(var(--blur, 0px)); }
  .dim { position: fixed; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(0, 0, 0, .25), rgba(0, 0, 0, .7)); }
  main { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 18px; }
  .icon { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 18px 50px rgba(0, 0, 0, .5); }
  h1 { margin: 0; font-size: clamp(30px, 6vw, 52px); font-weight: 800; letter-spacing: -.02em; text-shadow: 0 4px 24px rgba(0, 0, 0, .5); }
  .dl { display: inline-flex; align-items: center; gap: 12px; padding: 18px 34px; border-radius: 18px; background: var(--accent); color: var(--on-accent);
    font-size: 20px; font-weight: 800; text-decoration: none; box-shadow: 0 12px 34px rgba(0, 0, 0, .45), 0 0 0 6px color-mix(in srgb, var(--accent) 22%, transparent); transition: transform .15s, filter .15s; }
  .dl:hover { transform: translateY(-2px); filter: brightness(1.06); }
  .dl svg { width: 22px; height: 22px; }
  .meta { font-size: 13px; color: rgba(239, 234, 228, .75); }
  .meta a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
  .meta a:hover { color: #fff; }
  footer { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 12px; color: rgba(239, 234, 228, .45); }
</style>
</head>
<body>
<div class="bg" id="bg"></div><div class="dim"></div>
<main>
  <img class="icon" id="icon" src="logo.png" alt="">
  <h1 id="name">MelinaSMP Launcher</h1>
  <a class="dl" id="dl" href="https://github.com/Glonft/launcher/releases/latest">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11 3a1 1 0 1 1 2 0v10.6l3.3-3.3a1 1 0 1 1 1.4 1.4l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 1 1 1.4-1.4l3.3 3.3zM4 19a1 1 0 0 1 1-1h14a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1z"/></svg>
    <span id="dl-text">Pobierz launcher</span>
  </a>
  <div class="meta" id="meta">&nbsp;</div>
</main>
<footer>Nie jest powiązane z Mojang ani Microsoft.</footer>
<script>
const $ = (id) => document.getElementById(id);
const linux = /Linux/i.test(navigator.userAgent) && !/Android/i.test(navigator.userAgent);
const base = 'https://github.com/Glonft/launcher/releases/latest/download/';

(async () => {
  // wygląd z panelu: tło, ikona, nazwa i kolor akcentu
  try {
    const m = await (await fetch('manifest.json', { cache: 'no-store' })).json();
    const a = m.appearance || {};
    const name = a.appName || `${(m.server && m.server.name) || 'MelinaSMP'} Launcher`;
    $('name').textContent = name;
    document.title = name;
    if (a.icon && a.icon.url) $('icon').src = a.icon.url;
    if (a.background && a.background.url) {
      $('bg').style.backgroundImage = `url("${a.background.url}")`;
      $('bg').style.setProperty('--blur', `${Number(a.background.blur) || 0}px`);
    }
    if (a.colors && /^#[0-9a-f]{6}$/i.test(a.colors.accent || '')) {
      const c = a.colors.accent;
      const lum = (parseInt(c.slice(1, 3), 16) * 299 + parseInt(c.slice(3, 5), 16) * 587 + parseInt(c.slice(5, 7), 16) * 114) / 1000;
      document.documentElement.style.setProperty('--accent', c);
      document.documentElement.style.setProperty('--on-accent', lum > 150 ? '#1a1205' : '#ffffff');
    }
  } catch { /* zostaje domyślny wygląd */ }

  // najnowsza wersja i właściwy plik (nazwa pliku może się zmienić razem z nazwą launchera)
  let setup = `${base}MelinaSMP-Launcher-Setup.exe`;
  let portable = `${base}MelinaSMP-Launcher-Portable.exe`;
  let appimage = `${base}MelinaSMP-Launcher.AppImage`;
  let version = '';
  try {
    const r = await (await fetch('https://api.github.com/repos/Glonft/launcher/releases/latest')).json();
    version = String(r.tag_name || '').replace(/^v/, '');
    for (const f of r.assets || []) {
      if (/-Setup\.exe$/i.test(f.name)) setup = f.browser_download_url;
      else if (/-Portable\.exe$/i.test(f.name)) portable = f.browser_download_url;
      else if (/\.AppImage$/i.test(f.name)) appimage = f.browser_download_url;
    }
  } catch { /* zostają stałe linki */ }

  $('dl').href = linux ? appimage : setup;
  $('dl-text').textContent = linux ? 'Pobierz launcher (Linux)' : 'Pobierz launcher';
  const meta = $('meta');
  meta.replaceChildren();
  if (version) meta.append(`Wersja ${version} · `);
  const link = (href, text) => Object.assign(document.createElement('a'), { href, textContent: text });
  if (linux) meta.append(link(setup, 'Windows'), ' · ', link(portable, 'Windows bez instalacji'));
  else meta.append(link(portable, 'Bez instalacji (portable)'), ' · ', link(appimage, 'Linux'));
})();
</script>
</body>
</html>
