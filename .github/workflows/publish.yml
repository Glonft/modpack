# Każdy push na main z nowymi/zmienionymi modami w pack/ publikuje
# nowy manifest na GitHub Pages. Gracze dostaną zmiany przy następnym "GRAJ".
# Wymaga: Settings → Pages → Source: "GitHub Actions".
name: Publish modpack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: pages
        uses: actions/configure-pages@v5
      - run: node tools/generate-manifest.js pack public "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
